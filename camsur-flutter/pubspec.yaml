name: camsur_pro
description: Camsur AI Studio — AI photo editing & generation.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  get: ^4.7.2
  get_storage: ^2.1.1
  dio: ^5.8.0+1
  cached_network_image: ^3.4.1
  flutter_cache_manager: ^3.4.1
  intl: ^0.20.2
  flutter_svg: ^2.1.0
  image_picker: ^1.2.3
  uuid: ^4.6.0
  path: ^1.9.1
  share_plus: ^13.3.0
  gal: ^2.3.3
  path_provider: ^2.1.6
  phosphoricons_flutter: ^1.0.0
  google_sign_in: ^7.2.0
  sign_in_with_apple: ^8.2.0
  crypto: ^3.0.7
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/brand/
    - assets/images/
    - assets/icons/

  fonts:
    - family: Outfit
      fonts:
        - asset: google_fonts/Outfit-Regular.ttf
          weight: 400
        - asset: google_fonts/Outfit-Medium.ttf
          weight: 500
        - asset: google_fonts/Outfit-SemiBold.ttf
          weight: 600
        - asset: google_fonts/Outfit-Bold.ttf
          weight: 700
    - family: Figtree
      fonts:
        - asset: google_fonts/Figtree-Regular.ttf
          weight: 400
        - asset: google_fonts/Figtree-Medium.ttf
          weight: 500
        - asset: google_fonts/Figtree-SemiBold.ttf
          weight: 600

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icons/app_icon.png
  min_sdk_android: 21
  remove_alpha_ios: true
  background_color_ios: "#000000"
  adaptive_icon_background: "#000000"
  adaptive_icon_foreground: assets/icons/app_icon_foreground.png
  # Source foreground is already padded to the ~66% safe zone.
  adaptive_icon_foreground_inset: 0
  web:
    generate: true
    image_path: assets/icons/app_icon.png
    background_color: "#000000"
    theme_color: "#111111"
  windows:
    generate: true
    image_path: assets/icons/app_icon.png
    icon_size: 256
  macos:
    generate: true
    image_path: assets/icons/app_icon.png
